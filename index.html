<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CRUCIBATTLE!</title>
    <!-- Tailwind CSS per lo styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React e ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel per compilare il JSX nel browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @keyframes shake {
            0%, 100% { transform: rotate(0deg) translateX(0); }
            25% { transform: rotate(-5deg) translateX(-5px); }
            75% { transform: rotate(5deg) translateX(5px); }
        }
        .animate-shake { animation: shake 0.15s ease-in-out infinite; }
        
        .animate-in { animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        .zoom-in { animation: zoomIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); }
        @keyframes zoomIn { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        body { 
            overscroll-behavior: none; 
            -webkit-tap-highlight-color: transparent;
            background-color: #f0f4ff;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <!-- Configurazione sicura di Babel per forzare il runtime classico senza errori -->
    <script>
        Babel.registerPreset('react-classic', {
            presets: [
                [Babel.availablePresets.react, { runtime: 'classic' }]
            ]
        });
    </script>

    <script type="text/babel" data-presets="env,react-classic">
        // ==========================================
        //         CONFIGURAZIONE DI BASE DEL GIOCO
        // ==========================================
        const DEBUG_MODE = true; // Imposta a false per nascondere il pannello in basso una volta terminati i test

        const AUDIO_CONFIG = {
            bgMusicVolume: 0.3,       // Volume normale musica di sottofondo (0.0 - 1.0)
            bgMusicVolumeDucked: 0.1, // Volume musica ridotto durante la schermata del forziere (0.0 - 1.0)
            toneVolume: 0.4,          // Volume dei suoni dei tasti e della scossa del forziere (0.0 - 1.0)
            rewardToneVolume: 0.05,   // Volume della melodia iniziale del forziere (0.0 - 1.0)
            speechVolume: 1.0,        // Volume della voce che legge le parole (0.0 - 1.0)
            speechRate: 0.7,          // Velocità della voce che legge le parole (più basso = più lento)
            victoryVolume: 0.5,       // Volume del jingle MP3 di vittoria (0.0 - 1.0)
            videoVolume: 0.8          // Volume del video premio (0.0 - 1.0)
        };

        // ==========================================
        //         ELENCO DEI VIDEO PREMIO
        // ==========================================
        // I video devono risiedere direttamente dentro la cartella "assets/"
        const REWARD_VIDEOS = [
            "skibidi_toilet.mp4",
            "skibidi_toilet_gigante.mp4"
        ];

        const { useState, useEffect, useCallback, useRef } = React;
        
        const Icon = ({ name, size = 24, className = "", fill = "none" }) => {
            const iconRef = useRef(null);
            useEffect(() => {
                if (iconRef.current) {
                    lucide.createIcons({
                        root: iconRef.current.parentNode
                    });
                }
            }, [name]);
            return <i data-lucide={name} ref={iconRef} className={className} style={{ width: `${size}px`, height: `${size}px`, fill: fill }}></i>;
        };

        const GRID_SIZE = 8; 
        const WORDS_PER_REWARD = 1; // Ogni quante parole mostrare il forziere

        const FALLBACK_WORDS = [
            "MAMMA", "PAPA", "NONNO", "NONNA", "CANE", "GATTO", "SOLE", "MARE", 
            "CASA", "PALLA", "LIBRO", "FIORE", "PANE", "LATTE", "MELA", "NIDO",
            "RANA", "LUNA", "LUCE", "ORSO", "UVA", "VINO", "ERBA", "TRENO",
            "FRUTTA", "SCUOLA", "GIOCO"
        ];

        const App = () => {
            const [words, setWords] = useState([]);
            const [loading, setLoading] = useState(true);
            const [currentWord, setCurrentWord] = useState('');
            const [grid, setGrid] = useState([]);
            const [isUppercase, setIsUppercase] = useState(true);
            const [found, setFound] = useState(false);
            const [gameStarted, setGameStarted] = useState(false);
            const [correctCoords, setCorrectCoords] = useState([]);
            const [feedbackMap, setFeedbackMap] = useState({}); 
            const [foundCount, setFoundCount] = useState(0);
            const [totalSolved, setTotalSolved] = useState(0);
            const [showReward, setShowReward] = useState(false);
            const [chestState, setChestState] = useState('closed'); // 'closed', 'shaking', 'ready_to_open', 'open'
            const [selectedVideo, setSelectedVideo] = useState('');
            
            const [debugLogs, setDebugLogs] = useState([]);
            const [isConsoleOpen, setIsConsoleOpen] = useState(true);

            const speechIntervalRef = useRef(null);
            const audioCtxRef = useRef(null);
            const bgMusicRef = useRef(null);
            const videoRef = useRef(null);

            const addLog = useCallback((msg, type = "info") => {
                const timestamp = new Date().toLocaleTimeString();
                setDebugLogs(prev => [{ timestamp, msg, type }, ...prev].slice(0, 100));
                console.log(`[GameDebug] [${type.toUpperCase()}] ${msg}`);
            }, []);

            useEffect(() => {
                const handleError = (event) => {
                    addLog(`Errore di runtime: ${event.message} in ${event.filename}:${event.lineno}`, "error");
                };
                window.addEventListener('error', handleError);
                return () => window.removeEventListener('error', handleError);
            }, [addLog]);

            useEffect(() => {
                bgMusicRef.current = new Audio('audio/background_music.mp3');
                bgMusicRef.current.loop = true;
                bgMusicRef.current.volume = AUDIO_CONFIG.bgMusicVolume;
                addLog("File audio/background_music.mp3 istanziato.");

                return () => {
                    if (bgMusicRef.current) {
                        bgMusicRef.current.pause();
                        bgMusicRef.current = null;
                    }
                };
            }, [addLog]);

            useEffect(() => {
                const loadWords = async () => {
                    try {
                        const response = await fetch('assets/words.txt');
                        if (!response.ok) throw new Error(`HTTP ${response.status}`);
                        const text = await response.text();
                        const list = text.split(/\r?\n/)
                            .map(w => w.trim().toUpperCase())
                            .filter(w => w.length >= 3 && w.length <= GRID_SIZE);
                        
                        if (list.length > 0) {
                            setWords(list);
                        } else {
                            throw new Error("Nessuna parola idonea trovata nel file txt.");
                        }
                    } catch (err) {
                        setWords(FALLBACK_WORDS);
                    } finally {
                        setLoading(false);
                    }
                };
                loadWords();
            }, [addLog]);

            useEffect(() => {
                if (videoRef.current && showReward && chestState === 'open') {
                    videoRef.current.volume = AUDIO_CONFIG.videoVolume;
                }
            }, [showReward, chestState, selectedVideo]);

            const playTone = (freq, type = 'sine', duration = 0.1, volume = AUDIO_CONFIG.toneVolume) => {
                try {
                    if (!audioCtxRef.current) {
                        audioCtxRef.current = new (window.AudioContext || window.webkitAudioContext)();
                    }
                    const ctx = audioCtxRef.current;
                    if (ctx.state === 'suspended') ctx.resume();
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, ctx.currentTime);
                    gain.gain.setValueAtTime(volume, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + duration);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + duration);
                } catch (e) {}
            };

            const playRewardSound = () => {
                const tones = [523.25, 659.25, 783.99, 1046.50];
                tones.forEach((t, i) => {
                    setTimeout(() => playTone(t, 'square', 0.4, AUDIO_CONFIG.rewardToneVolume), i * 150);
                });
            };

            const initGame = useCallback((forceNextCase = null) => {
                if (words.length === 0) return;
                const nextCase = forceNextCase !== null ? forceNextCase : !isUppercase;
                setIsUppercase(nextCase);
                const word = words[Math.floor(Math.random() * words.length)];
                const displayWord = nextCase ? word.toUpperCase() : word.toLowerCase();
                setCurrentWord(displayWord);
                setFound(false);
                setFoundCount(0);
                setFeedbackMap({});
                
                let newGrid = Array(GRID_SIZE).fill(null).map(() => 
                    Array(GRID_SIZE).fill(null).map(() => {
                        const charCode = Math.floor(Math.random() * 26) + (nextCase ? 65 : 97);
                        return String.fromCharCode(charCode);
                    })
                );

                const row = Math.floor(Math.random() * GRID_SIZE);
                const startCol = Math.floor(Math.random() * (GRID_SIZE - word.length + 1));
                const coords = [];
                for (let i = 0; i < word.length; i++) {
                    newGrid[row][startCol + i] = displayWord[i];
                    coords.push(`${row}-${startCol + i}`);
                }
                setGrid(newGrid);
                setCorrectCoords(coords);
            }, [isUppercase, words, addLog]);

            const speakWord = useCallback(() => {
                if (!currentWord || found || !gameStarted || showReward) return;
                const utterance = new SpeechSynthesisUtterance(currentWord.toLowerCase());
                utterance.lang = 'it-IT';
                utterance.rate = AUDIO_CONFIG.speechRate; 
                utterance.volume = AUDIO_CONFIG.speechVolume;
                window.speechSynthesis.speak(utterance);
            }, [currentWord, found, gameStarted, showReward]);

            useEffect(() => {
                if (gameStarted && !found && !showReward) {
                    speakWord();
                    speechIntervalRef.current = setInterval(speakWord, 4000);
                } else {
                    clearInterval(speechIntervalRef.current);
                }
                return () => clearInterval(speechIntervalRef.current);
            }, [gameStarted, found, speakWord, showReward]);

            const handleStartGame = () => {
                setGameStarted(true);
                initGame(true);
                addLog("Partita avviata dall'utente.");
                if (bgMusicRef.current) {
                    bgMusicRef.current.play()
                        .catch(e => addLog(`Musica bloccata dal browser: ${e.message}`, "warning"));
                }
            };

            const handleExitGame = () => {
                window.speechSynthesis.cancel();
                if (speechIntervalRef.current) {
                    clearInterval(speechIntervalRef.current);
                }
                if (bgMusicRef.current) {
                    bgMusicRef.current.pause();
                    bgMusicRef.current.currentTime = 0;
                }
                setGameStarted(false);
                setShowReward(false);
                setFound(false);
            };

            const handleCellClick = (r, c) => {
                if (found || showReward) return;
                const id = `${r}-${c}`;
                if (correctCoords.includes(id)) {
                    if (feedbackMap[id] !== 'correct') {
                        playTone(660, 'sine', 0.15, AUDIO_CONFIG.toneVolume);
                        const newFeedback = { ...feedbackMap, [id]: 'correct' };
                        setFeedbackMap(newFeedback);
                        const newCount = foundCount + 1;
                        setFoundCount(newCount);
                        if (newCount === correctCoords.length) {
                            setFound(true);
                            const nextTotal = totalSolved + 1;
                            setTotalSolved(nextTotal);
                            addLog(`Parola completata! Totale completate: ${nextTotal}`);
                            
                            setTimeout(() => playTone(523, 'sine', 0.2, AUDIO_CONFIG.toneVolume), 100);
                            setTimeout(() => playTone(783, 'sine', 0.4, AUDIO_CONFIG.toneVolume), 300);

                            const isSpecialVictory = nextTotal % WORDS_PER_REWARD === 0;
                            const soundPath = isSpecialVictory ? 'audio/super_victory.mp3' : 'audio/victory.mp3';

                            const victoryAudio = new Audio(soundPath);
                            victoryAudio.volume = AUDIO_CONFIG.victoryVolume;
                            victoryAudio.play()
                                .catch(() => {
                                    const winSound = new SpeechSynthesisUtterance("Urrà!");
                                    winSound.lang = 'it-IT';
                                    winSound.pitch = 1.3;
                                    winSound.volume = AUDIO_CONFIG.speechVolume;
                                    window.speechSynthesis.speak(winSound);
                                });

                            setTimeout(() => {
                                if (nextTotal % WORDS_PER_REWARD === 0) {
                                    if (REWARD_VIDEOS.length > 0) {
                                        const randomVid = REWARD_VIDEOS[Math.floor(Math.random() * REWARD_VIDEOS.length)];
                                        // Modifica definitiva: I video sono ora cercati direttamente dentro la cartella "assets/"
                                        const videoPath = `assets/${randomVid}`;
                                        setSelectedVideo(encodeURI(videoPath));
                                        addLog(`Selezionato video premio casuale: ${videoPath}`);
                                    }
                                    setShowReward(true);
                                    setChestState('closed');
                                    if (bgMusicRef.current) bgMusicRef.current.volume = AUDIO_CONFIG.bgMusicVolumeDucked;
                                } else {
                                    initGame();
                                }
                            }, 3000);
                        }
                    }
                } else {
                    playTone(150, 'triangle', 0.3, AUDIO_CONFIG.toneVolume);
                    setFeedbackMap(prev => ({ ...prev, [id]: 'wrong' }));
                    setTimeout(() => {
                        setFeedbackMap(prev => {
                            const next = { ...prev };
                            if (next[id] === 'wrong') delete next[id];
                            return next;
                        });
                    }, 600);
                }
            };

            const handleOpenChest = () => {
                if (chestState === 'closed') {
                    setChestState('shaking');
                    playTone(200, 'square', 0.5, AUDIO_CONFIG.toneVolume);
                    setTimeout(() => {
                        setChestState('ready_to_open');
                    }, 1000);
                }
            };

            const triggerVideoPlayback = () => {
                setChestState('open');
                playRewardSound();
                if (bgMusicRef.current) bgMusicRef.current.volume = 0;
            };

            const handleCloseReward = () => {
                addLog("Chiusura schermata premio.");
                setShowReward(false);
                setChestState('closed');
                setSelectedVideo('');
                if (bgMusicRef.current) {
                    bgMusicRef.current.volume = AUDIO_CONFIG.bgMusicVolume;
                }
                initGame();
            };

            const loadTestVideo = () => {
                const testUrl = "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4";
                addLog(`Forzatura video di test: ${testUrl}`, "warning");
                setSelectedVideo(testUrl);
                setChestState('open');
            };

            return (
                <div className="relative min-h-screen flex flex-col justify-between pb-24 select-none">
                    <div 
                        className="relative flex flex-col items-center flex-grow p-2 font-sans touch-none overflow-hidden"
                        style={{ 
                            backgroundImage: gameStarted ? "url('assets/game_background.jpg')" : "url('assets/start_background.jpg')",
                            backgroundSize: 'cover',
                            backgroundPosition: 'center',
                            backgroundRepeat: 'no-repeat',
                            minHeight: '100vh'
                        }}
                    >
                        {/* Overlay Premio con Video */}
                        {showReward && (
                            <div className="fixed inset-0 z-[100] flex flex-col items-center justify-center bg-indigo-900/95 p-4 animate-in">
                                {chestState === 'closed' || chestState === 'shaking' ? (
                                    <React.Fragment>
                                        <div className="text-yellow-400 text-4xl font-black mb-12 tracking-widest animate-bounce uppercase text-center">PREMIO SPECIALE!</div>
                                        <div onClick={handleOpenChest} className={`relative cursor-pointer transition-transform ${chestState === 'shaking' ? 'animate-shake' : 'hover:scale-105 active:scale-95'}`}>
                                            <div className="absolute -inset-8 bg-yellow-400/20 rounded-full blur-3xl animate-pulse"></div>
                                            <div className="bg-orange-600 w-48 h-40 rounded-xl border-t-8 border-orange-400 border-x-4 shadow-2xl flex items-center justify-center relative overflow-hidden">
                                                <div className="absolute top-1/2 w-full h-4 bg-orange-800"></div>
                                                <div className="w-12 h-12 bg-yellow-400 rounded-lg border-4 border-orange-800 z-10"></div>
                                            </div>
                                        </div>
